<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>比喻的種子_四種田地</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: "Microsoft JhengHei", sans-serif;
        background: #111;
    }

    /* ⭐ 滑出式 Sidebar */
    .sidebar {
        width: 240px;
        background: #222;
        color: white;
        padding-top: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.4);

        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        transition: transform 0.3s ease;
        z-index: 1000;

        overflow-y: auto;
        max-height: 100vh;
    }

    /* ⭐ 隱藏時滑入左側 */
    .sidebar.hidden {
        transform: translateX(-240px);
    }

    /* ⭐ 群組標題 */
    .group-title {
        padding: 14px 20px;
        font-size: 20px;
        cursor: pointer;
        background: #333;
        border-bottom: 1px solid #444;
        transition: 0.3s;
    }

    .group-title:hover {
        background: #444;
    }

    /* ⭐ 群組內容（可折疊） */
    .group-content {
        display: none;
        padding-left: 10px;
    }

    .group-content.active {
        display: block;
    }

    /* ⭐ Sidebar 按鈕 */
    .sidebar button {
        width: 100%;
        padding: 16px;
        background: none;
        border: none;
        color: white;
        font-size: 18px;
        text-align: left;
        cursor: pointer;
        transition: 0.3s;
    }

    .sidebar button:hover {
        background: #444;
    }

    /* ⭐ 右側內容區 */
    .content {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
    }

    /* ⭐ iframe 頁面 */
    .page {
        display: none;
        width: 100%;
        height: 100%;
    }

    .page.active {
        display: block;
    }

    /* ⭐ Sidebar 開關按鈕 */
    .toggle-btn {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2000;
        background: rgba(255,255,255,0.15);
        color: white;
        border: none;
        padding: 10px 14px;
        font-size: 22px;
        cursor: pointer;
        border-radius: 6px;
        backdrop-filter: blur(6px);
        transition: 0.3s;
    }

    .toggle-btn:hover {
        background: rgba(255,255,255,0.3);
    }
</style>

</head>
<body>

<!-- ⭐ Sidebar 開關按鈕 -->
<button class="toggle-btn" onclick="toggleSidebar()">☰</button>

<!-- ⭐ 左側 Sidebar -->
<div class="sidebar" id="sidebar">

    <!-- ⭐ 群組 1：種子的比喻 -->
    <div class="group-title" onclick="toggleGroup('group1')">📘 種子的比喻</div>
    <div id="group1" class="group-content">
        <button onclick="showPage('page1')">🌰 1_1) 比喻的種子的實體</button>
        <button onclick="showPage('page2')">📖 1_1a) 比喻的種子的實體_講解</button>
        <button onclick="showPage('page3')">🫘 1_2) 比喻的種子的種類</button>
        <button onclick="showPage('page4')">⭐ 1_3) 比喻的種子的實體的重要性</button>
    </div>

    <!-- ⭐ 群組 2：田地的比喻 -->
    <div class="group-title" onclick="toggleGroup('group2')">📗 田地的比喻</div>
    <div id="group2" class="group-content">
        <button onclick="showPage('page5')">🌾 2) 比喻的田地</button>
        <button onclick="showPage('page6')">🟫 3) 關於4種田地的比喻</button>
        <button onclick="showPage('page7')">📌 4) 核心整理</button>
    </div>

</div>

<!-- ⭐ 右側內容區 -->
<div class="content">

    <div id="page1" class="page active">
        <iframe src="./html/比喻的種子的實體.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="page2" class="page">
        <iframe src="./html/比喻的種子的實體_講解.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="page3" class="page">
        <iframe src="./html/比喻的種子的種類.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="page4" class="page">
        <iframe src="./html/比喻的種子的重要性.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="page5" class="page">
        <iframe src="./html/2.比喻的田地.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="page6" class="page">
        <iframe src="./html/3.關於4種田地的比喻.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <div id="page7" class="page">
        <iframe src="./html/4.核心整理.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

</div>

<script>
/* ⭐ 切換頁面 */
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ⭐ Sidebar 滑出／滑入 */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('hidden');
}

/* ⭐ 群組展開／收合 */
function toggleGroup(groupId) {
    const group = document.getElementById(groupId);
    group.classList.toggle('active');
}
</script>

</body>
</html>

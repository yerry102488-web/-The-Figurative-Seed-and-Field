<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>天國主頁（滑出式 Sidebar）</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: "Microsoft JhengHei", sans-serif;
        background: #111;
    }

    /* ⭐ 滑出式 Sidebar */
    .sidebar {
        width: 240px;
        background: #222;
        color: white;
        padding-top: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.4);

        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        transition: transform 0.3s ease;
        z-index: 1000;
    }

    /* ⭐ 隱藏時滑入左側 */
    .sidebar.hidden {
        transform: translateX(-240px);
    }

    .sidebar button {
        width: 100%;
        padding: 18px;
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        text-align: left;
        cursor: pointer;
        transition: 0.3s;
    }

    .sidebar button:hover {
        background: #444;
    }

    /* ⭐ 右側內容區 */
    .content {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: black;
        overflow: hidden;
    }

    /* ⭐ iframe 頁面 */
    .page {
        display: none;
        width: 100%;
        height: 100%;
    }

    .page.active {
        display: block;
    }

    /* ⭐ Sidebar 開關按鈕 */
    .toggle-btn {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2000;
        background: rgba(255,255,255,0.15);
        color: white;
        border: none;
        padding: 10px 14px;
        font-size: 22px;
        cursor: pointer;
        border-radius: 6px;
        backdrop-filter: blur(6px);
        transition: 0.3s;
    }

    .toggle-btn:hover {
        background: rgba(255,255,255,0.3);
    }
</style>

</head>
<body>

<!-- ⭐ Sidebar 開關按鈕 -->
<button class="toggle-btn" onclick="toggleSidebar()">☰</button>

<!-- ⭐ 左側 Sidebar -->
<div class="sidebar" id="sidebar">
    <button onclick="showPage('page1')">🌳 比喻的種子的實體</button>
    <button onclick="showPage('page2')">🌱 比喻的種子的實體_講解</button>
    <button onclick="showPage('page3')">🌱 比喻的種子的種類</button>
    <button onclick="showPage('page4')">🌱 比喻的種子的重要性</button>
    <button onclick="showPage('page5')">🌱 2.比喻的田地</button>
</div>

<!-- ⭐ 右側內容區 -->
<div class="content">

    <!-- Page1：比喻的種子的實體 -->
    <div id="page1" class="page active">
        <iframe src="./html/比喻的種子的實體.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- Page2：比喻的種子的實體_講解 -->
    <div id="page2" class="page">
        <iframe src="./html/比喻的種子的實體_講解.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- Page3：比喻的種子的種類 -->
    <div id="page3" class="page">
        <iframe src="./html/比喻的種子的種類.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- Page4：比喻的種子的重要性 -->
    <div id="page4" class="page">
        <iframe src="./html/比喻的種子的重要性.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <!-- Page5：2.比喻的田地 -->
    <div id="page5" class="page">
        <iframe src="./html/2.比喻的田地.html" style="width:100%; height:100%; border:none;"></iframe>
    </div>

</div>

<script>
/* ⭐ 切換頁面 */
function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* ⭐ Sidebar 滑出／滑入 */
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('hidden');
}
</script>

</body>
</html>

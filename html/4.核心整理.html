<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>芥菜種的比喻</title>

<style>
    body {
        margin: 0;
        font-family: "Microsoft JhengHei", sans-serif;

        /* ⭐ 背景光流動畫 */
        background: radial-gradient(circle at 20% 30%, rgba(140, 196, 236, 0.25), transparent 60%),
                    radial-gradient(circle at 80% 70%, rgba(255,180,0,0.25), transparent 60%),
                    black;
        animation: bgFlow 12s infinite alternate ease-in-out;
    }

    @keyframes bgFlow {
        0% { background-position: 20% 30%, 80% 70%; }
        100% { background-position: 30% 40%, 70% 60%; }
    }

    /* 背景圖片容器 */
    .bg-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: url('../image/4.核心整理.png') no-repeat center center;
        background-size: contain;
    }

    /* 按鈕（透明） */
    .btn {
        position: absolute;
        cursor: pointer;
        background: rgba(255,255,255,0);
        border: none;
        width: 100px;
        height: 30px;
        transition: 0.3s;
    }

    .btn:hover {
        box-shadow: 0 0 18px #00B0F0;
        transform: scale(1.05);
    }

    /* ⭐ 視窗縮放＋滑入 */
    @keyframes modalPop {
        from { opacity: 0; transform: scale(0.85) translateX(-60px); }
        to { opacity: 1; transform: scale(1) translateX(0); }
    }

    /* 彈出視窗背景 */
    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        justify-content: center;
        align-items: center;
    }

    /* ⭐ 毛玻璃效果 */
    .modal-content {
        background: rgba(34, 34, 34, 0.45);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 0 25px rgba(255,255,255,0.25);
        padding: 30px;
        border-radius: 14px;
        width: 60%;
        color: white;
        font-size: 24px;
        line-height: 1.6;
        animation: modalPop 0.8s ease;

        /* ⭐ 新增：避免內容太多把 X 擠掉 */
        overflow-y: auto;
        max-height: 80vh;
    }

    .close {
        float: right;
        cursor: pointer;
        font-size: 32px;
        color: #ff6666;
    }

    /* ⭐ 經文光暈呼吸效果 */
    .glow-text {
        color: #3399ff;
        font-weight: bold;
        font-family: DFKai-SB;
        font-size: 40px;
        text-shadow: 0 0 12px #3399ff;
        animation: glowPulse 2.5s infinite ease-in-out;
    }

    @keyframes glowPulse {
        0% { text-shadow: 0 0 8px #3399ff; opacity: 0.85; }
        50% { text-shadow: 0 0 22px #66ccff; opacity: 1; }
        100% { text-shadow: 0 0 8px #3399ff; opacity: 0.85; }
    }

    @media (max-width: 600px) {
        .modal-content {
            width: 90%;
            padding: 20px;
            font-size: 18px;
        }
        .glow-text {
            font-size: 28px !important;
        }
    }
</style>
</head>

<body>

<div id="mouse-pos"
     style="position:fixed; bottom:10px; right:10px; 
            color:white; font-size:22px; 
            background:rgba(0,0,0,0.4); padding:8px 14px;
            border-radius:8px; z-index:9999;">
</div>


<div class="bg-container">

    <!-- P45. 核心整理 -->
    <button class="btn" style="left: 30%; top: 17%"
        onclick="openModal(
            '<span style=&quot;color:#E97132;font-weight:bold;font-size:54px;&quot;>核心整理</span>',
            '種子≈道===田地≈人的心田與教會',
            '我們今天學習了比喻的種子和田地,我們來整理一下核心的內容,種子是話語,這個話語可以分爲神的話語和魔鬼的話語,但成爲神的兒女的條件,是要有神的種子,因此天國的奧祕是種子,然後說田地是人的心和教會,所以祝願大家都能夠明白這話語,成爲從神的種子重生變化爲神的子女,',
            '<span style=&quot;font-size:28px;font-weight:bold;&quot;>' +
            '<br>' +
            '<br>' +            
            '</span>'
        )">
    </button>

</div>

<!-- ⭐ 彈出視窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>

        <!-- 標題 -->
        <div id="modal-title"></div>

        <!-- 經文（兩段逐字＋光暈） -->
        <div id="modal-verse"></div>

        <!-- 解釋文字 -->
        <div id="modal-extra" style="margin-top:20px;"></div>
    </div>
</div>

<script>

/* ⭐ 逐字動畫 */
function typeWriter(element, text, speed = 60) {
    element.innerText = "";
    let i = 0;
    function typing() {
        if (i < text.length) {
            element.innerText += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

/* ⭐ 語音朗讀功能 */
function speakText(text) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-TW";     // 使用台灣中文語音
    utter.rate = 1;           // 語速
    utter.pitch = 1;          // 音調
    speechSynthesis.cancel(); // 先停止其他語音
    speechSynthesis.speak(utter);
}

/* ⭐ 開啟視窗（逐字＋語音） */
function openModal(titleHtml, verseLine1, verseLine2, extraHtml) {

    document.getElementById("modal-title").innerHTML = titleHtml;

    const verseEl = document.getElementById("modal-verse");
    const extraEl = document.getElementById("modal-extra");

    verseEl.innerHTML = "";
    extraEl.innerHTML = extraHtml;

    document.getElementById("modal").style.display = "flex";

    // ⭐ 第一段逐字
    const line1 = document.createElement("div");
    line1.className = "glow-text";
    verseEl.appendChild(line1);
    typeWriter(line1, verseLine1, 60);

    // ⭐ 第二段逐字（延遲）
    setTimeout(() => {
        const line2 = document.createElement("div");
        line2.className = "glow-text";
        verseEl.appendChild(line2);
        typeWriter(line2, verseLine2, 60);
    }, verseLine1.length * 60 + 300);

    // ⭐ 語音朗讀（把兩段經文合併）
    speakText(verseLine1 + "。" + verseLine2);
}

/* ⭐ 關閉視窗 */
function closeModal() {
    speechSynthesis.cancel(); // 停止語音
    document.getElementById("modal").style.display = "none";
}

document.addEventListener("mousemove", function(e) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    // 計算百分比（四捨五入）
    const xPercent = Math.round((e.clientX / w) * 100);
    const yPercent = Math.round((e.clientY / h) * 100);

    // 顯示在畫面右下角
    const posBox = document.getElementById("mouse-pos");
    posBox.innerText = `X: ${xPercent}%   Y: ${yPercent}%`;
});


</script>

</body>
</html>

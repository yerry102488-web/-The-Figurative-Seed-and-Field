        height: 30px;

    /* ⭐ 視窗縮放＋滑入 */

        to { opacity: 1; transform: scale(1) translateX(0); }
    }

    /* 彈出視窗背景 */
    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        justify-content: center;
        align-items: center;
    }

    /* ⭐ 毛玻璃效果 */
    .modal-content {

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255,255,255,0.15);

    @keyframes glowPulse {
        0% { text-shadow: 0 0 8px #3399ff; opacity: 0.85; }
        50% { text-shadow: 0 0 22px #66ccff; opacity: 1; }
        100% { text-shadow: 0 0 8px #3399ff; opacity: 0.85; }
    }

    @media (max-width: 600px) {
        .modal-content {
            width: 90%;
            padding: 20px;
            font-size: 18px;
        }
        .glow-text {
            font-size: 28px !important;
        }
    }
</style>

<!-- ⭐ 彈出視窗 -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>

<script>

/* ⭐ 逐字動畫 */
function typeWriter(element, text, speed = 60) {
    element.innerText = "";
    let i = 0;
    function typing() {
        if (i < text.length) {
            element.innerText += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }
    typing();
}

/* ⭐ 語音朗讀功能 */
function speakText(text) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-TW";     // 使用台灣中文語音
    utter.rate = 1;           // 語速
    utter.pitch = 1;          // 音調
    speechSynthesis.cancel(); // 先停止其他語音
    speechSynthesis.speak(utter);
}

/* ⭐ 開啟視窗（逐字＋語音） */
function openModal(titleHtml, verseLine1, verseLine2, extraHtml) {

    document.getElementById("modal-title").innerHTML = titleHtml;

    const verseEl = document.getElementById("modal-verse");
    const extraEl = document.getElementById("modal-extra");

    verseEl.innerHTML = "";
    extraEl.innerHTML = extraHtml;

    document.getElementById("modal").style.display = "flex";

    // ⭐ 第一段逐字
    const line1 = document.createElement("div");
    line1.className = "glow-text";
    verseEl.appendChild(line1);
    typeWriter(line1, verseLine1, 60);

    // ⭐ 第二段逐字（延遲）
    setTimeout(() => {
        const line2 = document.createElement("div");
        line2.className = "glow-text";
        verseEl.appendChild(line2);
        typeWriter(line2, verseLine2, 60);
    }, verseLine1.length * 60 + 300);

    // ⭐ 語音朗讀（把兩段經文合併）
    speakText(verseLine1 + "。" + verseLine2);
}

/* ⭐ 關閉視窗 */
function closeModal() {
    speechSynthesis.cancel(); // 停止語音
    document.getElementById("modal").style.display = "none";
}

document.addEventListener("mousemove", function(e) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    // 計算百分比（四捨五入）
    const xPercent = Math.round((e.clientX / w) * 100);
    const yPercent = Math.round((e.clientY / h) * 100);

    // 顯示在畫面右下角
    const posBox = document.getElementById("mouse-pos");
    posBox.innerText = `X: ${xPercent}%   Y: ${yPercent}%`;
});


</script>
